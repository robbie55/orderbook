name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  lint:
    name: clang-format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18 ninja-build
          sudo ln -sf "$(which clang-format-18)" /usr/local/bin/clang-format
          sudo ln -sf "$(which clang-tidy-18)" /usr/local/bin/clang-tidy

      - name: clang-format (dry run, error on diff)
        run: |
          find include tests -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror

      - name: Configure (for compile_commands.json)
        run: cmake --preset debug

      - name: clang-tidy
        # Run on translation units only; headers are analysed in-context via
        # HeaderFilterRegex (running clang-tidy on a bare .hpp has no include
        # path and produces spurious file-not-found diagnostics).
        run: |
          find tests -name '*.cpp' \
            | xargs clang-tidy -p build/debug
